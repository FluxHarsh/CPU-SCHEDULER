body{margin:0;background-color:#F4B52E;background-image:radial-gradient(rgba(18,18,18,.32) 1.3px,transparent 1.6px);background-size:16px 16px}
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#121212}
.seen #loader,.no-anim #loader{display:none}
.ld-strips{position:absolute;inset:0;display:flex}
.ld-strips i{flex:1;position:relative;background-color:#F4B52E;background-image:radial-gradient(rgba(18,18,18,.32) 1.3px,transparent 1.6px);background-size:16px 16px;background-position:calc(var(--n)*-20vw) 0;box-shadow:0 10px 0 var(--c),0 13px 0 #121212}
.ld-card{position:relative;width:min(360px,86vw);padding:26px;background:#FDF1E6;border:3px solid #121212;border-radius:20px;box-shadow:6px 7px 0 #121212;text-align:center}
.ld-mark{display:grid;gap:4px;justify-items:center;margin:0 auto 10px}
.ld-mark i{display:block;height:6px;border-radius:3px;background:#121212;transform-origin:left;animation:ld-bar 1.1s ease-in-out infinite alternate}
.ld-mark i:nth-child(1){width:26px}.ld-mark i:nth-child(2){width:40px;background:#E5544E;animation-delay:.15s}.ld-mark i:nth-child(3){width:18px;animation-delay:.3s}
@keyframes ld-bar{from{transform:scaleX(.3)}to{transform:scaleX(1)}}
.ld-title{margin:0;font:800 1.7rem/1 system-ui,sans-serif;letter-spacing:-.03em}
.ld-track{display:flex;height:22px;margin:18px 0 12px;border:3px solid #121212;border-radius:8px;overflow:hidden;background:#fff}
.ld-track b{flex:var(--w);background:var(--c);border-right:3px solid #121212;transform-origin:left;transform:scaleX(0);animation:ld-fill .45s cubic-bezier(.3,1.4,.5,1) forwards;animation-delay:calc(var(--k)*.22s)}
.ld-track b:last-child{border-right:0}
@keyframes ld-fill{to{transform:scaleX(1)}}
.ld-line{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){#loader{display:none}}
